<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1714;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5B7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4B5A0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="1" y="1" width="30" height="30" rx="6" ry="6" fill="url(#bgGrad)" stroke="#E8D5B7" stroke-width="1" stroke-opacity="0.3"/>
  <!-- PK Text -->
  <text x="16" y="22" font-family="Georgia, serif" font-size="14" font-weight="600" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-0.5">PK</text>
</svg>
